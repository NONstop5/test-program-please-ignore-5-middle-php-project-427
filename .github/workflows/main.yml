# Name of workflow
name: PHP CI

# Trigger the workflow on push or pull request
on:
    - push
    - pull_request

jobs:
    # build – произвольно выбранное имя задания
    # их может быть больше одного
    build:
        # The type of machine to run the job on
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: flight_booking_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d flight_booking_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flight_booking_test

        steps: # список шагов, которые надо выполнить
            # экшен — выполняет какую-то задачу
            # checkout — клонирует репозиторий
            # Check-out repository under GitHub workspace
            # https://github.com/actions/checkout
            - uses: actions/checkout@v4
                # Step's name
            - name: Setup PHP
                # Action gives to setup the PHP environment to test application
                # https://github.com/shivammathur/setup-php
              uses: shivammathur/setup-php@v2
              with:
                  # Specify the PHP version
                  php-version: '8.2'
                  extensions: pdo_pgsql
            - name: Locate Composer cache
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php82-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-php82-composer-
            # Install project
            - name: Install project
              run: make install
            # Run linter
            - name: Run linter
              run: make lint
            # Run tests
            - name: Run tests
              run: make test
